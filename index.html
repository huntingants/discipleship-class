/* Layout: one narrow column, a top bar, and a bottom tab bar. Teacher and student sides share the same pieces. */
:root {
  /* Default */
  --bg: #f0f2f5; --surface: #ffffff; --tint: #dfe3e8; --ink: #1a1a2e; --muted: #6b7a8d; --line: #d2d8e0;
  --navy: #1e3a5f; --on-navy: #ffffff; --gold: #d4953a; --gold-soft: #e2b56e;
  --ask-bg: #fdf5ea; --ask-ink: #5a4220; --focus: #d4953a;
  --ok: #2da44e; --ok-bg: #c8e6d0; --over: #e5342d; --over-bg: #f5ccc9;
}

/* Dark Mode */
@media (prefers-color-scheme: dark) {

    --bg: #0c1520; --surface: #1a2d45; --tint: #243a54; --ink: #e8ecf0; --muted: #9aa8b8; --line: #2e4460;

    --ok: #30d158; --ok-bg: #173325; --over: #ff453a; --over-bg: #3a1f1b;
  }
}

}
  --fs: 20px;
  --serif: "Source Serif 4", "New York", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1520; --surface: #1a2d45; --tint: #243a54; --ink: #e8ecf0; --muted: #9aa8b8; --line: #2e4460;
    --navy: #d4953a; --on-navy: #0c1520; --gold: #d4953a; --gold-soft: #e2b56e; --ask-bg: #1e3350; --ask-ink: #e8d4a8; --focus: #d4953a;
    --ok: #30d158; --ok-bg: #173325; --over: #ff453a; --over-bg: #3a1f1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1520; --surface: #1a2d45; --tint: #243a54; --ink: #e8ecf0; --muted: #9aa8b8; --line: #2e4460;
  --navy: #d4953a; --on-navy: #0c1520; --gold: #d4953a; --gold-soft: #e2b56e; --ask-bg: #1e3350; --ask-ink: #e8d4a8; --focus: #d4953a;
  --ok: #30d158; --ok-bg: #173325; --over: #ff453a; --over-bg: #3a1f1b;
  color-scheme: dark;
}
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 1rem; line-height: 1.68;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(5.5rem + env(safe-area-inset-bottom, 0px));
  overflow-wrap: break-word;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--navy); z-index: 30; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
a, button, summary { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 40rem; margin: 0 auto; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  background: var(--navy); color: var(--on-navy);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  background: color-mix(in srgb, var(--navy) 85%, transparent); }
.bar-in { max-width: 40rem; margin: 0 auto; display: flex; align-items: center; gap: .5rem; min-height: 3.2rem; }
.bar .tbtn { font-family: var(--sans); font-weight: 600; font-size: .85rem; background: transparent; border: 1.5px solid rgba(255,255,255,.45); color: var(--on-navy);
  border-radius: 999px; min-height: 2.6rem; min-width: 2.6rem; padding: 0 .9rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; }
.bar .tbtn:active { background: rgba(255,255,255,.15); }
.bar .role { font-family: var(--sans); font-weight: 700; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; background: rgba(255,255,255,.2); color: var(--on-navy); border-radius: 999px; padding: .3rem .7rem; white-space: nowrap; }
.bar .where { flex: 1; min-width: 0; font-family: var(--sans); font-size: .8rem; font-weight: 600; letter-spacing: .02em; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .9; }
.bar .sizer { display: flex; gap: .35rem; }
.bar .sizer .tbtn { padding: 0; width: 2.6rem; }
.preview-bar { background: var(--gold-soft); color: #ffffff; font-family: var(--sans); font-weight: 600; font-size: .82rem; padding: .5rem 16px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); display: flex; gap: .8rem; align-items: center; justify-content: center; flex-wrap: wrap; }
.preview-bar button { font-family: var(--sans); font-weight: 700; background: var(--navy); color: #ffffff; border: 0; border-radius: 999px; min-height: 2.4rem; padding: 0 .9rem; cursor: pointer; }

/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 max(4px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-right, 0px));
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  background: color-mix(in srgb, var(--surface) 80%, transparent); }
.tabs-in { max-width: 40rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { background: none; border: 0; cursor: pointer; color: var(--muted); font-family: var(--sans); font-weight: 700; font-size: .68rem; letter-spacing: .02em; min-height: 3.7rem; padding: .35rem 0 .25rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .18rem; position: relative; transition: color .2s ease; }
.tabs button svg { width: 1.45rem; height: 1.45rem; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
.tabs button:active svg { transform: scale(.88); }
.tabs button[aria-current="page"] { color: var(--gold); }
.tabs button[aria-current="page"] svg { stroke-width: 2.4; }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 2rem; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }

.toast { position: fixed; left: 50%; bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 1rem) scale(.95); background: var(--navy); color: var(--on-navy); font-family: var(--sans); font-weight: 600; font-size: .85rem; line-height: 1.4; padding: .7rem 1.2rem; border-radius: .9rem; max-width: min(90vw, 28rem); opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s cubic-bezier(.4,0,.2,1); z-index: 40; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.15); }
.toast.on { opacity: 1; transform: translate(-50%, 0) scale(1); }

/* shared pieces */
.hero { padding: 1.6rem 0 .8rem; }
.eyebrow { font-family: var(--sans); font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin: 0 0 .6rem; }
h1 { font-family: var(--sans); font-weight: 700; font-size: 1.85rem; line-height: 1.15; letter-spacing: -.01em; margin: 0 0 .6rem; text-wrap: balance; }
h2.sub { font-family: var(--sans); font-size: 1.25rem; line-height: 1.2; margin: 1.8rem 0 .8rem; }
.lede { color: var(--muted); margin: 0 0 .6rem; font-size: .95rem; }
.small { font-size: .82rem; color: var(--muted); line-height: 1.5; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 1.3rem; padding: 1rem 1.1rem; margin: 0 0 .9rem; box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.03); transition: box-shadow .2s, transform .2s; }
.card h3 { font-family: var(--sans); font-size: 1.05rem; margin: 0 0 .5rem; line-height: 1.25; }
.card > :last-child { margin-bottom: 0; }
.card p { margin: 0 0 .7rem; }
.card.navy { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.card.navy .eyebrow, .card.navy small.k { color: var(--gold-soft); }
.card.tint { background: var(--tint); border-color: transparent; }
.card.warn { border-color: var(--gold-soft); border-left-width: 4px; }
.k { display: block; font-family: var(--sans); font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: .25rem; }
.btn { font-family: var(--sans); font-weight: 700; font-size: 1rem; border-radius: .9rem; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); min-height: 3.2rem; padding: .6rem 1.1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; line-height: 1.2; text-align: center; text-decoration: none; }
.btn.primary { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.btn.gold { background: var(--gold-soft); border-color: var(--gold-soft); color: #ffffff; }
.btn.block { display: flex; width: 100%; }
.btn.sm { min-height: 2.6rem; font-size: .88rem; padding: .35rem .9rem; border-radius: 999px; }
.btn.ghost { border-color: var(--line); color: var(--muted); }
.btn { transition: transform .12s ease, box-shadow .2s, opacity .15s; }
.btn:active { transform: scale(.96); opacity: .88; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; margin: 0 0 .9rem; }
.row > .btn { flex: 1 1 10rem; }
label.f { display: block; font-family: var(--sans); font-weight: 700; font-size: .82rem; margin: 0 0 .35rem; }
input[type="text"], input[type="email"], input[type="password"], input[type="date"], textarea, select { width: 100%; font-family: var(--serif); font-size: 1rem; line-height: 1.5; background: var(--bg); border: 1.5px solid var(--line); border-radius: .7rem; padding: .7rem .8rem; min-height: 3rem; color: var(--ink); }
textarea { min-height: 7rem; resize: vertical; }
input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, input[type="date"]:focus, textarea:focus, select:focus { border-color: var(--focus); outline: none; }
.field { margin: 0 0 .9rem; }
.chk { display: flex; gap: .7rem; align-items: center; font-family: var(--sans); font-weight: 600; font-size: .9rem; min-height: 2.8rem; cursor: pointer; }
.chk input { width: 1.4rem; height: 1.4rem; accent-color: var(--gold); flex: none; }
.pill { display: inline-block; font-family: var(--sans); font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: .2rem .6rem; background: var(--tint); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.gold { background: var(--gold-soft); color: #ffffff; }
.bartrack { height: .55rem; border-radius: 999px; background: var(--tint); overflow: hidden; margin: .5rem 0; }
.bartrack i { display: block; height: 100%; background: var(--gold); border-radius: 999px; transition: width .6s cubic-bezier(.4,0,.2,1); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; margin: 0 0 .9rem; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 1.3rem; padding: .7rem .5rem; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.stat b { display: block; font-family: var(--sans); font-size: 1.5rem; line-height: 1.1; }
.stat span { display: block; overflow-wrap: anywhere; font-family: var(--sans); font-size: .6rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-top: .2rem; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; margin: .8rem 0 0; }
.step { text-align: center; overflow-wrap: anywhere; font-family: var(--sans); font-size: .62rem; font-weight: 700; color: var(--muted); }
.step i { display: flex; align-items: center; justify-content: center; width: 2.4rem; height: 2.4rem; margin: 0 auto .3rem; border-radius: 50%; border: 2px solid var(--line); font-style: normal; font-size: 1rem; color: transparent; transition: background .3s, border-color .3s, color .3s, box-shadow .3s; }
.step.on i { background: var(--gold); border-color: var(--gold); color: var(--bg); box-shadow: 0 2px 8px color-mix(in srgb, var(--gold) 40%, transparent); }
.step.on { color: var(--ink); }

/* lists */
.people { display: grid; grid-template-columns: minmax(0, 1fr); gap: .6rem; margin: 0 0 1rem; }
.person { display: flex; gap: .8rem; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 1.3rem; padding: .8rem 1rem; min-height: 3.6rem; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.04); transition: transform .15s ease, box-shadow .2s; }
.person:active { transform: scale(.98); }
.person { min-width: 0; }
.person .pill { white-space: normal; text-align: center; max-width: 5.5rem; }
.person .av { flex: none; width: 2.5rem; height: 2.5rem; border-radius: 50%; background: var(--navy); color: var(--on-navy); font-family: var(--sans); font-weight: 700; display: flex; align-items: center; justify-content: center; }
.person .nm { flex: 1; min-width: 0; font-family: var(--sans); font-weight: 700; line-height: 1.25; }
.person .nm small { display: block; font-family: var(--serif); font-weight: 400; font-size: .78rem; color: var(--muted); }
.person.here { border-color: var(--ok); background: var(--ok-bg); }
.tick { flex: none; width: 1.7rem; height: 1.7rem; border-radius: .4rem; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: var(--sans); font-weight: 700; color: transparent; }
.person.here .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
.dots { display: grid; grid-template-columns: repeat(21, 1fr); gap: 3px; margin: .6rem 0 .4rem; }
.dots i { aspect-ratio: 1; border-radius: 3px; background: var(--tint); }
.dots i.on { background: var(--gold); }
.dots i.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.entry { border-top: 1px solid var(--line); padding: .8rem 0 0; margin: .8rem 0 0; }
.entry:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.entry .when { font-family: var(--sans); font-size: .72rem; font-weight: 700; color: var(--gold); letter-spacing: .06em; text-transform: uppercase; }
.entry p { margin: .2rem 0 0; white-space: pre-wrap; }
.tools { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; }

/* phases and lessons */
.phase { margin: .6rem 0 0; border-top: 1px solid var(--line); }
.phase > summary { list-style: none; cursor: pointer; padding: 1rem 0; display: flex; align-items: center; gap: .9rem; min-height: 3.6rem; }
.phase > summary::-webkit-details-marker { display: none; }
.pn { font-family: var(--sans); font-weight: 700; color: var(--gold); font-size: 2rem; line-height: 1; min-width: 1.6rem; }
.pt { flex: 1; min-width: 0; }
.pt b { display: block; font-family: var(--sans); font-size: 1.12rem; line-height: 1.2; }
.pt span { display: block; font-size: .78rem; color: var(--muted); margin-top: .2rem; line-height: 1.4; }
.chev { width: .7rem; height: .7rem; border-right: 2.5px solid var(--muted); border-bottom: 2.5px solid var(--muted); transform: rotate(45deg); transition: transform .15s; margin-right: .3rem; flex: none; }

    /* an invite link (...#invite=CODE) opens the "Start a class" form with the code filled in */
    var im = /^#invite=([A-Za-z0-9]+)$/.exec(location.hash || "");
    if (im) { S.auth.mode = "teacher"; S.auth.invite = im[1]; try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
    sb.auth.onAuthStateChange(function (ev, session) {
      if (ev === "PASSWORD_RECOVERY") { S.auth.mode = "reset"; S.auth.err = ""; S.auth.info = ""; setTimeout(function () { S.ready = true; render(); }, 0); }
      else if (ev === "SIGNED_IN" && session) { setTimeout(function () { enter(session); }, 0); }
      else if (ev === "SIGNED_OUT") { setTimeout(function () { if (S.session) resetState(); }, 0); }
    });
    try { var r = await sb.auth.getSession(); if (r.data && r.data.session) await enter(r.data.session); } catch (e) {}
    S.ready = true; render();
  }

    var known = { tdash: 1, tplan: 1, tl: 1, tr: 1, tpeople: 1, tperson: 1, tpray: 1, tset: 1, shome: 1, slist: 1, sl: 1, sm: 1, sjournal: 1, spray: 1, sme: 1 };
    if (!known[k]) k = def;

  /* ---------- keep the bottom menu clear of badges added by the host (for example Netlify's "Powered by" badge) ---------- */
  function dodgeBadge() {
    var nav = document.getElementById("tabs"), sheet = document.getElementById("sheetbg");
    if (!nav || document.body.classList.contains("authing") || document.body.classList.contains("lifted") || (sheet && sheet.classList.contains("on"))) return;
    var bs = nav.querySelectorAll("button"), hit = null, bottom = 0;
    for (var i = 0; i < bs.length && !hit; i++) {
      var r = bs[i].getBoundingClientRect(); if (!r.width) continue;
      [0.5, 0.85].forEach(function (f) {
        if (hit) return;
        var el = document.elementFromPoint(r.left + r.width / 2, r.top + r.height * f);
        if (el && !nav.contains(el) && el !== document.body && el !== document.documentElement) { hit = el; bottom = r.bottom; }
      });
    }
    if (!hit) return;
    var hr = hit.getBoundingClientRect();
    if (hr.height > 140 || hr.width > 420) return;
    var lift = Math.min(120, Math.max(0, Math.ceil(bottom - hr.top)) + 8);
    document.documentElement.style.setProperty("--lift", lift + "px");
    document.body.classList.add("lifted");
  }
  window.addEventListener("resize", dodgeBadge);
  [600, 1800, 4000, 9000].forEach(function (ms) { setTimeout(dodgeBadge, ms); });

        var l2 = held.slice(-2);

    for (var n = w - 1; n >= Math.max(1, w - 5); n--) {
      var missed = held.indexOf(n) >= 0 && mine.indexOf(n) < 0, unread = !has(S.me.done, n);
      if (missed || unread) items.push({ n: n, missed: missed, unread: unread });
    }
    if (!items.length) return "";
    var h = '<div class="card tint"><span class="k">Catch up</span><p class="small" style="margin-top:0">No worry. You can read what you missed any time. Start with the most recent one.</p>';
    items.slice(0, 3).forEach(function (x) {
      h += '<button type="button" class="lcard" data-go="sl' + x.n + '"><span class="ln">' + x.n + '</span><span class="lt">' + esc(LESSONS[x.n - 1].title) + "</span>" +
        '<span class="pills">' + (x.unread ? '<span class="pill gold">Not read</span>' : "") + (x.missed ? '<span class="pill">Missed class</span>' : "") + "</span></button>";
    });
    if (items.length > 3) h += '<button class="btn sm ghost" type="button" data-go="slist">And ' + (items.length - 3) + " more in the Lessons tab</button>";
    return h + "</div>";
  }

  /* ---- add to home screen ---- */
  function isStandalone() {
    try { return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; } catch (e) { return false; }
  }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); S.installEv = e; requestRender(); });
  window.addEventListener("appinstalled", function () { store("dc_hint", "1"); S.installEv = null; requestRender(); });
  function installCard() {
    if (S.preview || isStandalone() || store("dc_hint") === "1") return "";
    var ua = navigator.userAgent || "", ios = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var how, btn = "";
    if (S.installEv) { how = "Put this app on your home screen so it opens like any other app."; btn = '<button class="btn primary block" type="button" data-act="installgo">Add to Home Screen</button>'; }
    else if (ios) how = "Tap the Share button at the bottom of Safari (the square with an arrow), then choose “Add to Home Screen”. After that you can open this app with one tap.";
    else how = "Open your browser menu (the three dots), then tap “Add to Home screen” or “Install app”. After that you can open this app with one tap.";
    return '<div class="card"><span class="k">Keep it on your phone</span><p class="small" style="margin-top:0">' + how + "</p>" + btn +
      '<button class="btn sm ghost" type="button" data-act="hintoff">Not now</button></div>';
  }

  Object.assign(ACT, {
    noteadd: function () {
      var d = S.draft.note || {}, body = (d.body || "").trim();
      if (!body) { toast("Write the note first."); return; }
      if (!sb || !S.classId || !S.sel) return;
      var row = { id: uuid(), class_id: S.classId, student_id: S.sel, body: body.slice(0, 2000), follow_up: d.due || null };
      S.notes = (S.notes || []).concat([{ id: row.id, sid: S.sel, t: row.body, due: row.follow_up || "", done: false, ts: Date.now() }]);
      S.draft.note = { body: "", due: "" }; render();
      chain("note" + row.id, function () { return sb.from("student_notes").insert(row).then(ck); }).then(function (ok) {
        if (!ok) { S.notes = (S.notes || []).filter(function (n) { return n.id !== row.id; }); render(); }
      });
    },
    notedone: function (t) {
      var id = t.getAttribute("data-nid"), n = (S.notes || []).filter(function (x) { return x.id === id; })[0]; if (!n || !sb) return;
      n.done = !n.done; render();
      chain("note" + id, function () { return sb.from("student_notes").update({ done: n.done, updated_at: iso() }).eq("id", id).then(ck); }).then(function (ok) { if (!ok) { n.done = !n.done; render(); } });
    },
    notedel: function (t) {
      var id = t.getAttribute("data-nid");
      if (S.confirmNote !== id) { S.confirmNote = id; render(); setTimeout(function () { if (S.confirmNote === id) { S.confirmNote = null; render(); } }, 4000); return; }
      S.confirmNote = null;
      var keep = S.notes || []; S.notes = keep.filter(function (x) { return x.id !== id; }); render();
      if (!sb) return;
      chain("note" + id, function () { return sb.from("student_notes").delete().eq("id", id).then(ck); }).then(function (ok) { if (!ok) { S.notes = keep; render(); } });
    },
    attopen: function () { S.attOpen = true; S.attW = weekN() - 1; render(); },
    attclose: function () { S.attOpen = false; render(); },
    attw: function (t) {
      var id = t.getAttribute("data-id"), wk = S.attW >= 1 && S.attW < weekN() ? S.attW : weekN() - 1, k = attKey(wk), a = S.attendance[k] || { present: {} };
      a = { present: Object.assign({}, a.present) }; if (a.present[id]) delete a.present[id]; else a.present[id] = true;
      a.ts = Date.now(); S.attendance[k] = a; saveAtt(wk, id, !!a.present[id]); render();
    },
    installgo: function () {
      var ev = S.installEv; if (!ev) return;
      S.installEv = null;
      try { ev.prompt(); ev.userChoice.then(function (c) { if (c && c.outcome === "accepted") store("dc_hint", "1"); requestRender(); }, function () {}); } catch (e) {}
      render();
    },
    hintoff: function () { store("dc_hint", "1"); render(); }
  });
  Object.assign(BIND, {
    notebody: function (t) { S.draft.note = Object.assign({ body: "", due: "" }, S.draft.note, { body: t.value }); },
    notedue: function (t) { S.draft.note = Object.assign({ body: "", due: "" }, S.draft.note, { due: t.value }); }
  });
  Object.assign(CHG, {
    attweek: function (t) { S.attW = +t.value; render(); }
  });
  document.getElementById("sheetbg").addEventListener("click", function (e) { if (e.target.id === "sheetbg") ACT.vclose(); });
  document.addEventListener("click", function (e) {
    var g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); go(g.getAttribute("data-go")); return; }
    var a = e.target.closest("[data-act]");
    if (a) { var f = ACT[a.getAttribute("data-act")]; if (f) f(a, e); }
  });
  document.addEventListener("input", function (e) { var b = e.target.getAttribute && e.target.getAttribute("data-bind"); if (b && BIND[b]) BIND[b](e.target); });
  document.addEventListener("change", function (e) { var b = e.target.getAttribute && e.target.getAttribute("data-chg"); if (b && CHG[b]) CHG[b](e.target); });

  function setSize(i) { si = Math.max(0, Math.min(SIZES.length - 1, i)); document.documentElement.style.setProperty("--fs", SIZES[si] + "px"); store("dc_size", String(si)); }
  var sv = parseInt(store("dc_size"), 10); if (!isNaN(sv)) setSize(sv);
  document.getElementById("smaller").onclick = function () { setSize(si - 1); };
  document.getElementById("bigger").onclick = function () { setSize(si + 1); };

  /* restore theme */
  (function () { var th = store("dc_theme"); if (th) document.documentElement.setAttribute("data-theme", th); })();

  /* weekly reminder check */
  (function () {
    var last = parseInt(store("dc_lastvisit"), 10);
    var now = Date.now();
    store("dc_lastvisit", String(now));
    if (store("dc_remind") === "1" && "Notification" in window && Notification.permission === "granted" && last && now - last > 6 * 86400000) {
      try { new Notification("Time for your lesson!", { body: "It has been a while. Open the app to continue.", icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📖</text></svg>" }); } catch (e) {}
    }
  })();

  boot();
})();
</script>
